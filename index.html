<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回声公寓 - 704号房间</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="title-screen">
            <h1 class="game-title">回声公寓</h1>
            <p class="game-subtitle">—— 704号房间 ——</p>
            <div id="title-menu">
                <button class="menu-btn" onclick="startNewGame()">开始新游戏</button>
                <button class="menu-btn" onclick="loadGame()">继续游戏</button>
                <button class="menu-btn" onclick="showAbout()">关于游戏</button>
            </div>
            <p class="title-hint">戴上耳机，调暗灯光，体验最佳</p>
            <div id="title-music-controls">
                <button class="music-btn" id="title-music-toggle" onclick="toggleMusic('title')">🔊 音乐：开</button>
                <span class="music-vol-label">音量</span>
                <input type="range" id="title-volume" min="0" max="100" value="60" oninput="setMusicVolume(this.value, 'title')">
            </div>
        </div>

        <div id="game-screen" style="display:none;">
            <div id="status-bar">
                <div class="status-item">
                    <span class="status-label">理智</span>
                    <div class="sanity-bar">
                        <div id="sanity-fill" class="sanity-fill"></div>
                        <span id="sanity-text" class="sanity-text">100</span>
                    </div>
                </div>
                <div class="status-item">
                    <span class="status-label">进度</span>
                    <span id="progress-text" class="progress-text">0%</span>
                </div>
                <div class="status-actions">
                    <button class="action-btn" id="game-music-toggle" onclick="toggleMusic('game')">🔊</button>
                    <input type="range" id="game-volume" min="0" max="100" value="60" oninput="setMusicVolume(this.value, 'game')" style="width:60px;align-self:center;">
                    <button class="action-btn" onclick="openInventory()">物品</button>
                    <button class="action-btn" onclick="openClues()">线索</button>
                    <button class="action-btn" onclick="saveGame()">保存</button>
                    <button class="action-btn" onclick="backToTitle()">标题</button>
                </div>
            </div>

            <div id="scene-container">
                <div id="scene-title"></div>
                <div id="dialogue-box">
                    <div id="dialogue-text"></div>
                    <div id="dialogue-cursor" class="cursor">▌</div>
                </div>
                <div id="choices-container"></div>
            </div>

            <div id="location-bar">
                <span id="location-text">—</span>
            </div>
        </div>

        <div id="inventory-panel" class="panel" style="display:none;">
            <div class="panel-header">
                <h2>物品栏</h2>
                <button class="close-btn" onclick="closePanel('inventory-panel')">×</button>
            </div>
            <div id="inventory-list" class="panel-content"></div>
            <div class="panel-footer">
                <button id="combine-btn" class="action-btn" onclick="combineItems()" style="display:none;">组合物品</button>
            </div>
        </div>

        <div id="clues-panel" class="panel" style="display:none;">
            <div class="panel-header">
                <h2>线索记录</h2>
                <button class="close-btn" onclick="closePanel('clues-panel')">×</button>
            </div>
            <div id="clues-list" class="panel-content"></div>
        </div>

        <div id="password-panel" class="panel" style="display:none;">
            <div class="panel-header">
                <h2 id="password-title">输入密码</h2>
                <button class="close-btn" onclick="closePanel('password-panel')">×</button>
            </div>
            <div class="panel-content">
                <p id="password-hint"></p>
                <input type="text" id="password-input" class="password-input" maxlength="20" placeholder="请输入...">
                <button class="menu-btn" onclick="submitPassword()">确认</button>
                <p id="password-error" class="error-text"></p>
            </div>
        </div>

        <div id="ending-screen" style="display:none;">
            <div class="ending-content">
                <h1 id="ending-title"></h1>
                <p id="ending-type"></p>
                <div id="ending-text"></div>
                <div id="ending-stats"></div>
                <button class="menu-btn" onclick="backToTitle()">返回标题</button>
            </div>
        </div>

        <div id="about-panel" class="panel" style="display:none;">
            <div class="panel-header">
                <h2>关于游戏</h2>
                <button class="close-btn" onclick="closePanel('about-panel')">×</button>
            </div>
            <div class="panel-content about-content">
                <p><strong>《回声公寓 - 704号房间》</strong></p>
                <p>一款心理惊悚文字解密游戏</p>
                <p>———</p>
                <p>理智值：你的精神状态，某些选项会降低它。</p>
                <p>物品：收集到的道具，可能需要组合使用。</p>
                <p>线索：记录的关键信息，帮助你推理真相。</p>
                <p>———</p>
                <p>共有 5 个不同的结局等待你去发现。</p>
                <p>游戏进度会自动保存。</p>
            </div>
        </div>

        <div id="overlay"></div>
        <div id="toast"></div>
    </div>

    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
